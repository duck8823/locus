[package]
name = "locus"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "=0.26.0"
arboard = "3.6.1"
chrono = { version = "0.4.44", features = ["std"] }
directories = "6.0.0"
futures = "0.3.32"
http = "1.4.0"
octocrab = "0.49.7"
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
similar = "3.1.0"
slint = "1.15.1"
tokio = { version = "1.52.0", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.42"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tree-sitter = "0.26.8"
tree-sitter-go = "0.25.0"
which = "8.0.2"

[build-dependencies]
slint-build = "1.15.1"
